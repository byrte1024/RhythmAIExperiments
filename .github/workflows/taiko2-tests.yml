name: taiko2 tests

on:
  push:
    branches: [master]
    paths:
      - 'osu/taiko2/**'
      - '.github/workflows/taiko2-tests.yml'
  pull_request:
    paths:
      - 'osu/taiko2/**'
      - '.github/workflows/taiko2-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "osu/taiko2/uv.lock"

      - name: Install Python 3.13
        run: uv python install 3.13
        working-directory: osu/taiko2

      # Install the full locked dependency set. The checkpoint round-trip
      # tests need torch for `state_dict()` / `torch.save`; Chart tests use
      # numpy; samplers lazy-import torchaudio + librosa. Matches the local
      # development environment exactly — `uv.lock` is the source of truth.
      - name: Install deps (full lock, including dev group)
        run: uv sync --frozen --group dev
        working-directory: osu/taiko2

      - name: Run pytest
        run: uv run pytest tests -q
        working-directory: osu/taiko2
