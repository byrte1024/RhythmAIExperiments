[project]
name = "taiko2"
version = "0.1.0"
description = "Onset detection for osu!taiko — redesigned."
requires-python = "==3.13.*"
dependencies = [
    "torch==2.12.0.dev20260307+cu128",
    "torchaudio==2.11.0.dev20260227+cu128",
    "numpy==2.4.2",
    "scipy==1.17.1",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "soxr==1.0.0",
    "audioread==3.1.0",
    "numba==0.64.0",
    "llvmlite==0.46.0",
    "tqdm==4.67.3",
    "requests==2.32.5",
    "triton-windows==3.6.0.post25 ; sys_platform == 'win32'",
]

# Don't try to build taiko2 as a distributable package; we only need a
# managed venv with pinned deps. The code is imported via PYTHONPATH.
[tool.uv]
package = false

# PyTorch-nightly torch/torchaudio pin `triton` to a git-hash version that
# only exists on the nightly wheel index. `override-dependencies` relaxes
# that to any >=3.0 triton (on Linux, resolved from the nightly index;
# ignored on Windows since triton-windows takes its place).
override-dependencies = [
    "triton>=3.0.0 ; sys_platform == 'linux'",
]

# PyTorch nightly wheels live on a separate index; torch/torchaudio/triton
# must be resolved from it explicitly.
[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu128" }
torchaudio = { index = "pytorch-nightly-cu128" }
triton = { index = "pytorch-nightly-cu128", marker = "sys_platform == 'linux'" }
